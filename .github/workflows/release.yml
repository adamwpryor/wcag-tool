name: release

# Builds the downloads and attaches them to the GitHub release for a version tag, so
# people who never open the repository's folders can get them from the Releases page.
# dist/ stays out of git; this is the only place the built files are published.
#
# Two jobs, so write access never meets the code being built: `build` installs the pinned
# packages (requirements-ci.txt), tests and builds with a read-only token and hands the
# four files over as an artifact; `publish` only downloads them and attaches them with `gh`.
# Every action is pinned to a commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach files to, e.g. v0.3.0"
        required: true

permissions: {}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The tag must be a version (vX.Y.Z)
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag: $TAG" >&2; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -c requirements-ci.txt setuptools wheel
      - run: python -m pip install -c requirements-ci.txt --no-build-isolation -e ".[dev]"
      - run: pytest -q
      - run: python tools/build_skill.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads
          path: |
            dist/wcag-triage-skill.zip
            dist/wcag-triage-gemini.zip
            dist/wcag-triage-bot.zip
            dist/wcag-triage.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: The tag must be a version (vX.Y.Z)
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag: $TAG" >&2; exit 1; }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads
          path: dist
      - name: Create the release if it does not exist yet
        run: >
          gh release view "$TAG" >/dev/null 2>&1 ||
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
      - name: Attach the downloads
        run: >
          gh release upload "$TAG" --clobber
          dist/wcag-triage-skill.zip
          dist/wcag-triage-gemini.zip
          dist/wcag-triage-bot.zip
          dist/wcag-triage.md
