name: ci

# Every action is pinned to a commit (the comment names the release) and the job has a
# read-only token. Packages install at the exact versions in requirements-ci.txt, and
# pip-audit checks those pins against the advisory databases on every run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements-ci.txt setuptools wheel
      - run: python -m pip install -c requirements-ci.txt --no-build-isolation -e ".[dev]"
      - name: No known vulnerabilities in the pinned packages
        if: matrix.python-version == '3.12'
        run: pip-audit --no-deps --disable-pip -r requirements-ci.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
      - run: python tools/build_skill.py
