name: wcag-tool
channels:
  - conda-forge
dependencies:
  - python=3.11
  - python-docx>=1.1
  - python-pptx>=1.0
  - pypdf>=5.0
  - jsonschema>=4.20
  - pytest>=8
  - ruff
  - black
  - mypy
  - pip-audit>=2.10
  # conda-forge's pip-audit leaves out the filelock that its HTTP cache imports.
  - filelock
  - pip
  - pip:
      # The MCP Python SDK publishes to PyPI first. Move it to the conda-forge
      # block above as soon as the v2 feedstock is current; nothing else here is pip.
      - mcp>=2.0
      - -e .
